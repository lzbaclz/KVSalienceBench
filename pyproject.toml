[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xqp"
version = "0.1.0"
description = "KV saliency audit, archived analyses, and physical-KV reference validation"
authors = [{name = "Ziqing Li"}, {name = "Jiawei Guo"}, {name = "Kaicheng Tang"}, {name = "Jianxi Chen"}]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.3"]
# Install an appropriate GPU PyTorch wheel first; this extra does not choose CUDA.
# The pinned simulator imports pandas through seer.lap.features, including
# for its CPU smoke example; a pre-existing analysis environment can hide this.
validation = ["torch>=2.6,<2.11", "transformers==4.51.3", "safetensors>=0.5.3", "pandas>=2.0", "pytest>=8"]
trt = ["onnx", "onnxruntime-gpu", "tensorrt"]
eval = ["datasets", "evaluate", "transformers>=4.44"]
# headline GBDT baseline (icdm_full.json) needs LightGBM; without it baselines.py
# silently falls back to a weaker/slower sklearn GBDT, changing the numbers.
bench = ["lightgbm>=4.0"]
# figure generation (paper_icdm/figures)
paper = ["matplotlib>=3.8", "python-pptx>=1.0", "PyMuPDF>=1.24"]
# everything the CPU test suite + analysis drivers need (no GPU): the headline
# GBDT baseline (lightgbm), figures (matplotlib), and pytest itself. Install with
#   pip install -e .[test]
# then `pytest` works from the repo root with no further setup.
test = ["pytest>=8", "lightgbm>=4.0", "matplotlib>=3.8"]

[project.scripts]
xqp-train = "xqp.train_cli:main"
xqp-eval = "xqp.eval:main"

[tool.setuptools.packages.find]
include = ["xqp*"]

[tool.pytest.ini_options]
# Make `pytest` work from the repo root in a fresh `pip install -e .[test]` env
# without per-file sys.path hacks: the ICDM driver tests import modules from
# experiments/, and the lib tests import xqp from the repo root.
pythonpath = [".", "experiments"]
testpaths = ["tests"]
